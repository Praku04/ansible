<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ElevateXperia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
        
        .auth-card {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        /*.auth-image {
            background-image: url('../assets/images/register.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f8f9fa;
            min-height: 400px;
        }*/
        
        .auth-form {
            padding: 40px;
        }
        
        .auth-form h2 {
            margin-bottom: 30px;
            color: var(--primary-color);
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-control {
            height: 50px;
            border-radius: 10px;
            padding-left: 15px;
            border: 1px solid #ddd;
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: var(--primary-color);
        }
        
        .auth-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .social-login {
            margin-top: 20px;
        }
        
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
        }
        
        .fb-btn {
            background-color: #3b5998;
        }
        
        .google-btn {
            background-color: #db4437;
        }
        
        .twitter-btn {
            background-color: #1da1f2;
        }
        
        .linkedin-btn {
            background-color: #0077b5;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider-line {
            flex-grow: 1;
            height: 1px;
            background-color: #ddd;
        }
        
        .divider-text {
            padding: 0 15px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
        }
        
        .password-field-wrapper {
            position: relative;
        }
        
        .password-strength {
            height: 5px;
            margin-top: 10px;
            border-radius: 5px;
            background-color: #ddd;
            transition: all 0.3s ease;
        }
        
        .password-strength-text {
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        .weak {
            width: 25%;
            background-color: #dc3545;
        }
        
        .medium {
            width: 50%;
            background-color: #ffc107;
        }
        
        .strong {
            width: 75%;
            background-color: #28a745;
        }
        
        .very-strong {
            width: 100%;
            background-color: #20c997;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">ElevateXperia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="immersion-program.html">Immersion Program</a></li>
                    <li class="nav-item"><a class="nav-link" href="leadership-walk.html">Leadership Walk</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary login-btn" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="auth-card bg-white">
                        <div class="row g-0">
                            <div class="col-md-6 d-none d-md-block auth-image"></div>
                            <div class="col-md-6">
                                <div class="auth-form">
                                    <h2 class="text-center">Create Account</h2>
                                    <form id="registerForm">
                                        <div class="form-group">
                                            <label for="fullName" class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="email" class="form-label">Email Address</label>
                                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="password" class="form-label">Password</label>
                                            <div class="password-field-wrapper">
                                                <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                                                <span class="password-toggle" id="passwordToggle">
                                                    <i class="far fa-eye"></i>
                                                </span>
                                            </div>
                                            <div class="password-strength" id="passwordStrength"></div>
                                            <div class="password-strength-text" id="passwordStrengthText"></div>
                                        </div>
                                        <div class="form-group">
                                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                                            <div class="password-field-wrapper">
                                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                                                <span class="password-toggle" id="confirmPasswordToggle">
                                                    <i class="far fa-eye"></i>
                                                </span>
                                            </div>
                                            <div id="passwordMatch" class="mt-2 small"></div>
                                        </div>
                                        <div class="form-check mb-4">
                                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                            <label class="form-check-label" for="termsCheck">
                                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                                            </label>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100 auth-btn">Register</button>
                                        
                                        <div class="divider">
                                            <div class="divider-line"></div>
                                            <span class="divider-text">OR</span>
                                            <div class="divider-line"></div>
                                        </div>
                                        
                                        <div class="social-login text-center">
                                            <p class="mb-3">Register with</p>
                                            <a href="#" class="social-btn fb-btn"><i class="fab fa-facebook-f"></i></a>
                                            <a href="#" class="social-btn google-btn"><i class="fab fa-google"></i></a>
                                            <a href="#" class="social-btn twitter-btn"><i class="fab fa-twitter"></i></a>
                                            <a href="#" class="social-btn linkedin-btn"><i class="fab fa-linkedin-in"></i></a>
                                        </div>
                                        
                                        <div class="auth-footer">
                                            <p>Already have an account? <a href="login.html">Login</a></p>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password visibility toggle for password field
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordField = document.getElementById('password');
            
            passwordToggle.addEventListener('click', function() {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                
                // Toggle eye icon
                const eyeIcon = passwordToggle.querySelector('i');
                eyeIcon.classList.toggle('fa-eye');
                eyeIcon.classList.toggle('fa-eye-slash');
            });
            
            // Password visibility toggle for confirm password field
            const confirmPasswordToggle = document.getElementById('confirmPasswordToggle');
            const confirmPasswordField = document.getElementById('confirmPassword');
            
            confirmPasswordToggle.addEventListener('click', function() {
                const type = confirmPasswordField.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordField.setAttribute('type', type);
                
                // Toggle eye icon
                const eyeIcon = confirmPasswordToggle.querySelector('i');
                eyeIcon.classList.toggle('fa-eye');
                eyeIcon.classList.toggle('fa-eye-slash');
            });
            
            // Password strength checker
            const passwordStrength = document.getElementById('passwordStrength');
            const passwordStrengthText = document.getElementById('passwordStrengthText');
            
            passwordField.addEventListener('input', function() {
                const password = passwordField.value;
                const strength = checkPasswordStrength(password);
                
                // Update password strength indicator
                passwordStrength.className = 'password-strength';
                passwordStrengthText.textContent = '';
                
                if (password.length > 0) {
                    if (strength === 1) {
                        passwordStrength.classList.add('weak');
                        passwordStrengthText.textContent = 'Weak';
                        passwordStrengthText.style.color = '#dc3545';
                    } else if (strength === 2) {
                        passwordStrength.classList.add('medium');
                        passwordStrengthText.textContent = 'Medium';
                        passwordStrengthText.style.color = '#ffc107';
                    } else if (strength === 3) {
                        passwordStrength.classList.add('strong');
                        passwordStrengthText.textContent = 'Strong';
                        passwordStrengthText.style.color = '#28a745';
                    } else if (strength === 4) {
                        passwordStrength.classList.add('very-strong');
                        passwordStrengthText.textContent = 'Very Strong';
                        passwordStrengthText.style.color = '#20c997';
                    }
                }
            });
            
            // Check if passwords match
            const passwordMatch = document.getElementById('passwordMatch');
            
            confirmPasswordField.addEventListener('input', function() {
                if (passwordField.value === confirmPasswordField.value) {
                    passwordMatch.textContent = 'Passwords match';
                    passwordMatch.style.color = '#28a745';
                } else {
                    passwordMatch.textContent = 'Passwords do not match';
                    passwordMatch.style.color = '#dc3545';
                }
            });
            
            // Register form submission
            const registerForm = document.getElementById('registerForm');
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Check if passwords match
                if (passwordField.value !== confirmPasswordField.value) {
                    alert('Passwords do not match!');
                    return;
                }
                
                // Check password strength
                const strength = checkPasswordStrength(passwordField.value);
                if (strength < 2) {
                    alert('Please choose a stronger password!');
                    return;
                }
                
                const fullName = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const password = passwordField.value;
                
                // Call the register function from auth.js
                register(fullName, email, password);
            });
            
            // Function to check password strength
            function checkPasswordStrength(password) {
                let strength = 0;
                
                // Length check
                if (password.length >= 8) strength += 1;
                
                // Contains lowercase and uppercase letters
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
                
                // Contains numbers
                if (/[0-9]/.test(password)) strength += 1;
                
                // Contains special characters
                if (/[^a-zA-Z0-9]/.test(password)) strength += 1;
                
                return strength;
            }
        });
    </script>
    <script src="../js/auth.js"></script>
    <script src="../js/content-editor.js"></script>
</body>
</html>
