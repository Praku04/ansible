<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - ElevateXperia</title>
    <!-- Favicon -->
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
        }
        .logout-container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 10%;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            overflow: hidden;
            text-align: center;
            padding: 3rem;
        }
        .logout-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 1rem;
        }
        .card p {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .btn-cancel {
            background-color: #f8f9fa;
            border-color: #dee2e6;
            color: #6c757d;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 5px;
        }
        .btn-cancel:hover {
            background-color: #e9ecef;
            border-color: #dee2e6;
            color: #495057;
        }
        .btn-logout {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 5px;
        }
        .btn-logout:hover {
            background-color: var(--dark-color);
            border-color: var(--dark-color);
        }
        .logout-illustration {
            max-width: 250px;
            margin: 0 auto 2rem;
        }
        @media (max-width: 767.98px) {
            .logout-container {
                padding: 1rem;
                padding-top: 5rem;
            }
            .card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">ElevateXperia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="immersion-program.html">Immersion Program</a></li>
                    <li class="nav-item"><a class="nav-link" href="leadership-walk.html">Leadership Walk</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary login-btn" href="bootstrap-login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Logout Section -->
    <div class="logout-container">
        <div class="card">
            <img src="../assets/images/logout-illustration.svg" alt="Logout Illustration" class="logout-illustration">
            <div class="logout-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
            <h2>Sign Out</h2>
            <p>Are you sure you want to sign out from your account?</p>
            <div class="btn-group">
                <a href="javascript:history.back()" class="btn btn-cancel">Cancel</a>
                <button id="logoutBtn" class="btn btn-logout">Sign Out</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Logout button click handler
        document.getElementById('logoutBtn').addEventListener('click', function() {
            // Clear authentication data from localStorage
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            
            // Redirect to home page
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
