<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bootstrap Registration Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">BrandName</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="auth-card bg-white shadow">
                        <div class="auth-form p-4">
                            <h2 class="text-center">Create Account</h2>
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="position-relative">
                                        <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                                        <span class="password-toggle position-absolute" id="passwordToggle" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                                            <i class="far fa-eye"></i>
                                        </span>
                                    </div>
                                    <div class="password-strength" id="passwordStrength"></div>
                                    <div class="password-strength-text" id="passwordStrengthText"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <div class="position-relative">
                                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                                        <span class="password-toggle position-absolute" id="confirmPasswordToggle" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                                            <i class="far fa-eye"></i>
                                        </span>
                                    </div>
                                    <div id="passwordMatch" class="mt-2 small"></div>
                                </div>
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                    <label class="form-check-label" for="termsCheck">
                                        I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Register</button>
                                <div class="text-center my-3">
                                    <span>OR</span>
                                </div>
                                <div class="social-login text-center">
                                    <p class="mb-3">Register with</p>
                                    <a href="#" class="btn btn-outline-primary"><i class="fab fa-facebook-f"></i></a>
                                    <a href="#" class="btn btn-outline-danger"><i class="fab fa-google"></i></a>
                                    <a href="#" class="btn btn-outline-info"><i class="fab fa-twitter"></i></a>
                                    <a href="#" class="btn btn-outline-secondary"><i class="fab fa-linkedin-in"></i></a>
                                </div>
                                <div class="text-center mt-3">
                                    <p>Already have an account? <a href="login.html">Login</a></p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
