    <!-- Register Section -->
    <div class="register-container">
        <div class="card">
            <div class="row g-0">
                <div class="col-md-5 card-left">
                    <div class="brand-logo">ElevateXperia</div>
                    <div class="welcome-text">
                        <h2>Join Us Today</h2>
                        <p>Create an account to access our exclusive immersion programs and leadership walks.</p>
                    </div>
                    <div class="d-none d-md-block">
                        <img src="../assets/images/register-illustration.svg" alt="Register Illustration" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-7 card-right">
                    <h3>Create Account</h3>
                    <form id="registerForm">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
                            <label for="fullName">Full Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <label for="email">Email address</label>
                        </div>
                        <div class="form-floating mb-3 password-field-wrapper">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                            <span class="password-toggle" id="passwordToggle">

                            </span>
                            <div class="password-strength">
                                <div class="password-strength-meter" id="passwordStrengthMeter"></div>
                            </div>
                            <div class="password-strength-text" id="passwordStrengthText">Password strength</div>
                        </div>
                        <div class="form-floating mb-3 password-field-wrapper">
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                            <label for="confirmPassword">Confirm Password</label>
                            <span class="password-toggle" id="confirmPasswordToggle">
                                <i class="far fa-eye"></i>
                            </span>
                            <div id="passwordMatchText" class="password-strength-text"></div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label" for="termsCheck">
                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-register">Create Account</button>

                        </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Password visibility toggle for password field
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Password visibility toggle for confirm password field
        document.getElementById('confirmPasswordToggle').addEventListener('click', function() {
            const confirmPasswordField = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (confirmPasswordField.type === 'password') {
                confirmPasswordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                confirmPasswordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const meter = document.getElementById('passwordStrengthMeter');
            const text = document.getElementById('passwordStrengthText');
            
            // Check password strength
            let strength = 0;
            let feedback = '';
            
            if (password.length > 0) {
                // Length check
                if (password.length >= 8) strength += 25;
                
                // Character checks
                if (/[a-z]/.test(password)) strength += 25; // lowercase
                if (/[A-Z]/.test(password)) strength += 25; // uppercase
                if (/[0-9]/.test(password)) strength += 12.5; // numbers
                if (/[^A-Za-z0-9]/.test(password)) strength += 12.5; // special characters
                
                // Set feedback text
                if (strength < 30) {
                    feedback = 'Weak';
                    meter.style.backgroundColor = '#dc3545'; // red
                } else if (strength < 60) {
                    feedback = 'Moderate';
                    meter.style.backgroundColor = '#ffc107'; // yellow
                } else if (strength < 80) {
                    feedback = 'Strong';
                    meter.style.backgroundColor = '#28a745'; // green
                } else {
                    feedback = 'Very Strong';
                    meter.style.backgroundColor = '#198754'; // dark green
                }
            } else {
                feedback = 'Password strength';
            }
            
            // Update UI
            meter.style.width = strength + '%';
            text.textContent = feedback;
        });
        
        // Password match checker
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const matchText = document.getElementById('passwordMatchText');
            
            if (confirmPassword.length > 0) {
                if (password === confirmPassword) {
                    matchText.textContent = 'Passwords match';
                    matchText.style.color = '#28a745';
                } else {
                    matchText.textContent = 'Passwords do not match';
                    matchText.style.color = '#dc3545';
                }
            } else {
                matchText.textContent = '';
            }
        });
        
        // Register form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsCheck = document.getElementById('termsCheck').checked;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            // Validate password strength (minimum requirement)
            if (password.length < 8) {
                alert('Password must be at least 8 characters long!');
                return;
            }
            
            // Validate terms acceptance
            if (!termsCheck) {
                alert('You must accept the Terms of Service and Privacy Policy!');
                return;
            }
            
            // Call register function from auth.js
            register(fullName, email, password);
        });
    </script>
