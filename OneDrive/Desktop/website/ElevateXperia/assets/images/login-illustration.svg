<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Device Frame -->
  <rect x="100" y="50" width="200" height="150" rx="10" ry="10" fill="#ffffff" stroke="#00BCD4" stroke-width="3"/>
  
  <!-- Screen -->
  <rect x="110" y="60" width="180" height="130" rx="5" ry="5" fill="#f0f9ff"/>
  
  <!-- Login Form -->
  <rect x="130" y="80" width="140" height="25" rx="5" ry="5" fill="#ffffff" stroke="#3F51B5" stroke-width="1"/>
  <rect x="130" y="115" width="140" height="25" rx="5" ry="5" fill="#ffffff" stroke="#3F51B5" stroke-width="1"/>
  <rect x="130" y="150" width="140" height="25" rx="5" ry="5" fill="#00BCD4"/>
  
  <!-- Form Icons -->
  <circle cx="142" cy="92.5" r="5" fill="#3F51B5"/>
  <circle cx="142" cy="127.5" r="5" fill="#3F51B5"/>
  
  <!-- User Icon -->
  <path d="M142 92.5 L139 89.5 L145 89.5 Z" fill="#ffffff"/>
  <circle cx="142" cy="87" r="3" fill="#ffffff"/>
  
  <!-- Lock Icon -->
  <rect x="139" y="125" width="6" height="5" rx="1" ry="1" fill="#ffffff"/>
  <rect x="141" y="122" width="2" height="3" fill="#ffffff"/>
  
  <!-- Login Text -->
  <text x="200" y="167" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">LOGIN</text>
  
  <!-- Email Field Placeholder -->
  <text x="155" y="97" font-family="Arial" font-size="8" fill="#6c757d" text-anchor="start">Email</text>
  
  <!-- Password Field Placeholder -->
  <text x="155" y="132" font-family="Arial" font-size="8" fill="#6c757d" text-anchor="start">Password</text>
  
  <!-- Decorative Elements -->
  <circle cx="70" cy="70" r="20" fill="#FF5722" opacity="0.7"/>
  <circle cx="330" cy="230" r="25" fill="#3F51B5" opacity="0.7"/>
  <circle cx="50" cy="200" r="15" fill="#00BCD4" opacity="0.7"/>
  <circle cx="350" cy="80" r="15" fill="#FF5722" opacity="0.7"/>
  
  <!-- Abstract Lines -->
  <path d="M30 150 Q100 100 30 50" stroke="#00BCD4" stroke-width="2" fill="none"/>
  <path d="M370 150 Q300 200 370 250" stroke="#3F51B5" stroke-width="2" fill="none"/>
  
  <!-- Security Elements -->
  <circle cx="50" cy="150" r="10" fill="none" stroke="#3F51B5" stroke-width="2"/>
  <path d="M50 140 L50 160 M40 150 L60 150" stroke="#3F51B5" stroke-width="2"/>
  
  <circle cx="350" cy="150" r="10" fill="none" stroke="#00BCD4" stroke-width="2"/>
  <path d="M350 140 L350 160 M340 150 L360 150" stroke="#00BCD4" stroke-width="2"/>
</svg>