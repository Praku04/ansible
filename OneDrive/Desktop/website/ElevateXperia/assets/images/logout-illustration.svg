<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Modal Dialog -->
  <rect x="100" y="75" width="200" height="150" rx="10" ry="10" fill="#ffffff" stroke="#00BCD4" stroke-width="3"/>
  
  <!-- Modal Header -->
  <rect x="100" y="75" width="200" height="40" rx="10" ry="10" fill="#00BCD4"/>
  <rect x="100" y="95" width="200" height="20" fill="#00BCD4"/>
  
  <!-- Modal Title -->
  <text x="200" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Logout Confirmation</text>
  
  <!-- Modal Content -->
  <text x="200" y="135" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Are you sure you want to logout?</text>
  <text x="200" y="155" font-family="Arial" font-size="10" fill="#6c757d" text-anchor="middle">Your session will be terminated.</text>
  
  <!-- Modal Buttons -->
  <rect x="125" y="180" width="70" height="30" rx="5" ry="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/>
  <text x="160" y="200" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Cancel</text>
  
  <rect x="205" y="180" width="70" height="30" rx="5" ry="5" fill="#FF5722"/>
  <text x="240" y="200" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Logout</text>
  
  <!-- Logout Icon -->
  <circle cx="200" cy="50" r="25" fill="#3F51B5"/>
  <path d="M200 35 L200 55 M190 45 L210 45" stroke="white" stroke-width="3"/>
  <path d="M215 50 L205 60 M215 50 L205 40" stroke="white" stroke-width="3"/>
  
  <!-- Decorative Elements -->
  <circle cx="70" cy="70" r="20" fill="#FF5722" opacity="0.7"/>
  <circle cx="330" cy="230" r="25" fill="#3F51B5" opacity="0.7"/>
  <circle cx="50" cy="200" r="15" fill="#00BCD4" opacity="0.7"/>
  <circle cx="350" cy="80" r="15" fill="#FF5722" opacity="0.7"/>
  
  <!-- Abstract Lines -->
  <path d="M30 150 Q100 100 30 50" stroke="#00BCD4" stroke-width="2" fill="none"/>
  <path d="M370 150 Q300 200 370 250" stroke="#3F51B5" stroke-width="2" fill="none"/>
  
  <!-- Exit Door Icon -->
  <rect x="50" cy="150" width="20" height="30" fill="none" stroke="#3F51B5" stroke-width="2"/>
  <path d="M60 150 L60 180" stroke="#3F51B5" stroke-width="1"/>
  <circle cx="65" cy="165" r="2" fill="#3F51B5"/>
  <path d="M70 165 L80 165 L75 160 M80 165 L75 170" stroke="#3F51B5" stroke-width="2" fill="none"/>
  
  <!-- Lock Icon -->
  <rect x="330" y="150" width="15" height="20" rx="2" ry="2" fill="none" stroke="#00BCD4" stroke-width="2"/>
  <rect x="335" y="140" width="5" height="10" rx="2" ry="2" fill="none" stroke="#00BCD4" stroke-width="2"/>
</svg>